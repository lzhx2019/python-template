[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.0",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "uvicorn>=0.34",
    "python-multipart>=0.0.18",
    "passlib[bcrypt]>=1.7",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
