# ============================================================
# 生产环境 Docker Compose
# 用法：docker compose -f ops/docker-compose.yml up -d --build
# ============================================================

services:
  # ---------- 后端 API 服务 ----------
  backend:
    build:
      context: ..
      dockerfile: ops/Dockerfile.backend
    container_name: app-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./app.db}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network

  # ---------- 前端 Nginx 服务 ----------
  frontend:
    build:
      context: ..
      dockerfile: ops/Dockerfile.frontend
    container_name: app-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

volumes:
  backend-data:
    driver: local

networks:
  app-network:
    driver: bridge
